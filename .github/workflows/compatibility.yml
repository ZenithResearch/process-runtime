name: Runtime compatibility

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install hash-locked build and test tools
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Full suite, compatibility, regeneration, and rejection gate
        run: python -I scripts/ci_compatibility.py --output "$RUNNER_TEMP/compatibility"
      - name: Retain gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-compatibility-${{ github.sha }}
          path: |
            ${{ runner.temp }}/compatibility/*.log
            ${{ runner.temp }}/compatibility/report.json
            ${{ runner.temp }}/compatibility/source-suite.json
          if-no-files-found: error

  candidate-wheel:
    needs: compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install hash-locked build and test tools
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Recheck, build twice, and verify installed wheel
        run: python -I scripts/ci_compatibility.py --output "$RUNNER_TEMP/candidate" --package
      # This is a CI candidate artifact, not a package-registry release or production qualification.
      - name: Publish checked candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-wheel-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/candidate/dist/*.whl
            ${{ runner.temp }}/candidate/report.json
            ${{ runner.temp }}/candidate/source-suite.json
            ${{ runner.temp }}/candidate/installed-origins.json
            ${{ runner.temp }}/candidate/wheel-members.json
          if-no-files-found: error
      - name: Retain build and installed verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-package-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/candidate/*.log
          if-no-files-found: error
